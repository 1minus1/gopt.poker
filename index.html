<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOPT Standings</title>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=mobile-logo-20260505" />
  <style>
    body {
      font-family: 'Roboto Serif', serif;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Cal Sans', sans-serif;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
      min-width: 0;
    }
    table {
      margin: 1em 0;
    }
    h2, h1 {
      text-align: center;
      width: 100%;
    }
    #content-container {
      margin-left: 6em;
      margin-right: 6em;
    }
    @media (max-width: 768px) {
      .table-container {
        font-size: 0.75em;
        overflow-x: auto;
      }
      #content-container {
        margin-left: 1em;
        margin-right: 1em;
      }
    }
    .table-container {
      box-sizing: border-box;
      width: max-content;
      max-width: 100%;
      margin-right: auto;
      margin-left: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    main > section {
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .summary-table {
      white-space: nowrap;
    }
    .summary-night {
      margin-top: 1.25em;
    }
    .summary-night-heading {
      font-size: 1.05em;
      margin: 1.1em 0 0.25em;
      text-align: center;
    }
    .summary-table tbody tr:nth-child(odd) {
      background-color: #e0e0e0;
    }
    .summary-table tbody tr:nth-child(even) {
      background-color: #ffffff;
    }
    .summary-date-column,
    .summary-bracelet-column,
    .summary-major-column {
      display: none;
    }
    .bracelet-marker {
      border: 0.3em solid currentColor;
      border-radius: 50%;
      box-sizing: border-box;
      color: #d01818;
      display: inline-block;
      height: 1.2em;
      margin-left: 0.4em;
      vertical-align: -0.2em;
      width: 1.2em;
    }
    .season-filter-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.55em;
    }
    .season-filter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75em;
      flex-wrap: wrap;
    }
    .season-filter-controls a {
      color: #0645ad;
      text-decoration: underline;
    }
    #standings-title {
      box-sizing: border-box;
      margin-top: 0;
      padding: 0.35em 0.5em;
      transition: background-color 120ms ease, color 120ms ease;
    }
    #season-standings-table tfoot {
      font-weight: 700;
    }
    .all-time-major-summary {
      margin-top: 1.5em;
    }
    .standings-chart-disclosure {
      margin: 1.5em auto 0;
      max-width: 100%;
      text-align: center;
    }
    .standings-chart-disclosure summary {
      color: #0645ad;
      cursor: pointer;
      display: list-item;
      font-weight: 700;
      margin: 0 auto;
      text-decoration: underline;
      width: max-content;
    }
    .standings-chart-disclosure[open] summary {
      margin-bottom: 0.75em;
    }
    .standings-chart-list {
      margin-top: 1.5em;
    }
    .standings-chart-block {
      margin: 0 auto 2em;
      max-width: 100%;
    }
    .standings-chart-frame {
      box-sizing: border-box;
      margin: 0 auto;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .standings-chart {
      display: block;
      height: auto;
      margin: 0 auto;
      max-width: 100%;
      min-width: 700px;
    }
    .chart-axis,
    .chart-grid {
      stroke: #d7d7d7;
      stroke-width: 1;
    }
    .chart-axis {
      stroke: #222;
    }
    .chart-line {
      fill: none;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }
    .chart-point {
      stroke: #fff;
      stroke-width: 1.5;
    }
    .chart-label {
      fill: #222;
      font-family: 'Roboto Serif', serif;
      font-size: 13px;
    }
    .chart-title-label {
      font-family: 'Cal Sans', sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header style="text-align: center;">
    <img src="assets/logo.GIF" alt="GOPT Logo" class="logo" />
    <nav style="background-color: black; padding: 0.5em;">
      <a href="index.html" style="color: white; text-decoration: none; margin: 0 1em; font-weight: bold;">Standings</a>
      <a href="record.html" style="color: white; text-decoration: none; margin: 0 1em;">Record</a>
      <a href="rules.html" style="color: white; text-decoration: none; margin: 0 1em;">Rules</a>
      <a href="technote.html" style="color: white; text-decoration: none; margin: 0 1em;">Tech Note</a>
      <a href="upload.html" style="color: white; text-decoration: none; margin: 0 1em;">Admin</a>
    </nav>
    <h1 id="standings-title">All Time Standings</h1>
  </header>
  <div id="content-container">
    <main>
      <section style="margin-bottom: 1em;">
        <div class="season-filter-controls">
          <a href="#current-season" id="current-season-link" hidden>Current season</a>
          <div class="season-filter-row">
            <label for="season-filter" style="font-size: 1.2em; font-weight: bold;">Other Seasons:</label>
            <select id="season-filter" style="font-size: 1.2em; padding: 0.25em 0.5em;"></select>
          </div>
        </div>
      </section>
      <section>
        <h2 id="season-header" style="display: none;">Tournament Data</h2>
        <div class="table-container">
          <table id="standings-table" style="display: none;">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <!-- <h2>Stacked Tournament Results</h2> -->
        <div class="table-container">
          <table id="stacked-table" style="display: none;">
            <thead>
              <tr>
                <th>Date</th>
                <th>Season</th>
                <th>IsMajor</th>
                <th>MajorName</th>
                <th>PointsAtStake</th>
                <th>Player Count</th>
                <th>Place</th>
                <th>Player</th>
                <th>Points Earned</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="gopt-data.js"></script>
  <script>
    function fetchCurrentDataText(sources = ['api/history/current', 'api/history-current.php', 'data/GOPTdatav2.csv', 'files/GOPThistory.txt']) {
      const [source, ...remaining] = sources;
      return fetch(source, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) {
            throw new Error(`Could not load ${source}.`);
          }
          return response.text();
        })
        .then(text => {
          if (!GoptData.looksLikeSupportedDataFile(text)) {
            throw new Error(`${source} did not return a supported GOPT data file.`);
          }
          return text;
        })
        .catch(error => {
          if (!remaining.length) throw error;
          return fetchCurrentDataText(remaining);
        });
    }

    function formatDisplayDate(timestamp) {
      return new Date(timestamp * 1000).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    fetchCurrentDataText()
      .then(data => {
        const parsedData = GoptData.parseDataFile(data, { normalizePlayerName: true });
        const table = document.getElementById('standings-table');
        const thead = table.querySelector('thead');
        const tbody = table.querySelector('tbody');
        const playerColumnCount = Math.max(15, ...parsedData.rows.map(row => row.finishers.length));

        const headers = [
          "League",
          "Season",
          "Date",
          "IsMajor",
          "MajorName",
          "PointsAtStake",
          "Player Count",
          ...Array.from({ length: playerColumnCount }, (_, index) => String(index + 1))
        ];

        const headerRow = document.createElement('tr');
        headers.forEach(header => {
          const th = document.createElement('th');
          th.textContent = header.trim();
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        if (headerRow.cells[0]) headerRow.cells[0].style.display = 'none';

        parsedData.rows.forEach(dataRow => {
          const row = document.createElement('tr');
          row.dataset.host = dataRow.host || '';

          const cells = [
            dataRow.league,
            dataRow.season,
            formatDisplayDate(dataRow.timestamp),
            dataRow.isMajor,
            dataRow.isMajor === 'YES' ? dataRow.majorName : 'NO',
            dataRow.pointsAtStake,
            String(dataRow.finishers.length),
            ...dataRow.finishers,
          ];

          cells.forEach(cell => {
            const td = document.createElement('td');
            td.textContent = String(cell || '').trim();
            row.appendChild(td);
          });

          if (row.cells[0]) row.cells[0].style.display = 'none';
          tbody.appendChild(row);
        });

        // After table is built, remove empty columns
        const allRows = [...table.rows];
        if (allRows.length > 1) {
          const colCount = allRows[0].cells.length;
          const colsToRemove = [];

          for (let colIndex = 0; colIndex < colCount; colIndex++) {
            let empty = true;
            for (let rowIndex = 1; rowIndex < allRows.length; rowIndex++) {
              const cellText = allRows[rowIndex].cells[colIndex]?.textContent.trim();
              if (cellText) {
                empty = false;
                break;
              }
            }
            if (empty) colsToRemove.push(colIndex);
          }

          // Remove cells from bottom to top to preserve correct indices
          for (let i = colsToRemove.length - 1; i >= 0; i--) {
            const index = colsToRemove[i];
            allRows.forEach(row => {
              if (row.cells[index]) row.deleteCell(index);
            });
          }
        }

        const seasonDateMap = {};
        document.querySelectorAll('#standings-table tbody tr').forEach(row => {
          const season = row.cells[1].textContent.trim();
          const date = new Date(row.cells[2].textContent.trim());
          if (!seasonDateMap[season] || date > seasonDateMap[season]) {
            seasonDateMap[season] = date;
          }
        });

        const seasonFilter = document.getElementById('season-filter');
        const currentSeasonLink = document.getElementById('current-season-link');
        const standingsTitle = document.getElementById('standings-title');
        let seasonColors = {};
        // Add "All Time" as the first option
        const allTimeOption = document.createElement('option');
        allTimeOption.value = "All Time";
        allTimeOption.textContent = "All Time";
        seasonFilter.appendChild(allTimeOption);

        const sortedSeasons = Object.entries(seasonDateMap)
          .sort((a, b) => b[1] - a[1]);  // Most recent first
        const currentSeason = sortedSeasons.find(([season]) => season === String(new Date().getFullYear()))?.[0];

        sortedSeasons.forEach(([season]) => {
          const option = document.createElement('option');
          option.value = option.textContent = season;
          seasonFilter.appendChild(option);
        });

        if (currentSeason) {
          currentSeasonLink.hidden = false;
          currentSeasonLink.textContent = `Current season: ${currentSeason}`;
        }

        function updateStackedTable(seasonFilterValue) {
          document.querySelectorAll('[data-generated-section="summary"]').forEach(section => {
            section.remove();
          });

          const stackedBody = document.querySelector('#stacked-table tbody');
          stackedBody.innerHTML = '';
          document.querySelectorAll('#standings-table tbody tr').forEach(row => {
            const rowSeason = row.cells[1]?.textContent.trim();
            if (seasonFilterValue !== "All Time" && rowSeason !== seasonFilterValue) return;

            const date = row.cells[2]?.textContent.trim();
            const season = rowSeason;
            const isMajor = row.cells[3]?.textContent.trim();
            const majorName = row.cells[4]?.textContent.trim();
            const pointsAtStake = row.cells[5]?.textContent.trim();
            const playerCount = row.cells[6]?.textContent.trim();

            for (let i = 7; i < row.cells.length; i++) {
              const player = row.cells[i]?.textContent.trim();
              if (player) {
                const place = i - 6;
                const n = parseInt(playerCount);
                const B = parseFloat(pointsAtStake);
                const base = 0.5 * n - 0.5;
                let points = B * (n - place) / base;
                if (isMajor.trim().toUpperCase() === 'NO') {
                  points /= 2;
                }
                if (isNaN(points)) {
                  points = 0;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                  <td>${date}</td>
                  <td>${season}</td>
                  <td>${isMajor}</td>
                  <td>${majorName}</td>
                  <td>${pointsAtStake}</td>
                  <td>${playerCount}</td>
                  <td>${place}</td>
                  <td>${player}</td>
                  <td>${points.toFixed(4)}</td>`;
                stackedBody.appendChild(tr);
              }
            }
          });
          generateSummaryTable();
          applyStripingByDate('stacked-table');
        }

        function formatSummaryDate(date) {
          return new Intl.DateTimeFormat('en-US', {
            year: '2-digit',
            month: 'numeric',
            day: 'numeric'
          }).format(new Date(date));
        }

        function getNightLabel(group) {
          if (group.isMajor?.trim().toUpperCase() === 'YES') {
            return group.majorName || 'Major Poker Night';
          }

          return 'Standard Poker Night';
        }

        function getSummaryNightHeading(group, seasonFilterValue) {
          const seasonLabel = seasonFilterValue === 'All Time'
            ? ` (Season ${group.season})`
            : '';
          return `${formatSummaryDate(group.date)}${seasonLabel}: ${getNightLabel(group)}`;
        }

        function createSummaryCell(label, value, className = '') {
          const td = document.createElement('td');
          td.dataset.label = label;
          td.textContent = value;
          if (className) {
            td.className = className;
          }
          return td;
        }

        function createBraceletMarker(season) {
          const marker = document.createElement('span');
          marker.className = 'bracelet-marker';
          marker.dataset.season = season;
          marker.title = 'Bracelet winner';
          marker.setAttribute('aria-label', 'Bracelet winner');
          if (seasonColors[season]) {
            marker.style.color = seasonColors[season];
          }
          return marker;
        }

        function generateSummaryTable() {
          document.querySelectorAll('[data-generated-section="summary"]').forEach(section => {
            section.remove();
          });

          document.querySelectorAll('[data-generated-section="season-standings"]').forEach(section => {
            section.remove();
          });

          const existingStandings = document.getElementById('season-standings-table');
          if (existingStandings) {
            const existingStandingsSection = existingStandings.closest('section');
            if (existingStandingsSection) {
              existingStandingsSection.remove();
            } else {
              existingStandings.parentElement.remove();
            }
          }

          const summary = {};
          const rows = document.querySelectorAll('#stacked-table tbody tr');

          rows.forEach(row => {
            const date = row.cells[0]?.textContent.trim();
            const player = row.cells[7]?.textContent.trim();
            const points = parseFloat(row.cells[8]?.textContent.trim());
            const isMajor = row.cells[2]?.textContent.trim();
            const majorName = row.cells[3]?.textContent.trim();
            const season = row.cells[1]?.textContent.trim();
            const key = `${season}|${date}|${player}`;
            if (!summary[key]) {
              summary[key] = { date, season, player, points: 0, places: [], isMajor, majorName };
            }
            summary[key].points += points;
            // Add the place to the places array
            summary[key].places.push(row.cells[6]?.textContent.trim());
          });

          const summaryEntries = Object.values(summary)
            .sort((a, b) => {
              const dateA = new Date(a.date);
              const dateB = new Date(b.date);
              if (dateA.getTime() !== dateB.getTime()) {
                return dateB - dateA;
              }
              const roundedPointsA = parseFloat(a.points.toFixed(2));
              const roundedPointsB = parseFloat(b.points.toFixed(2));
              if (roundedPointsA !== roundedPointsB) {
                return roundedPointsB - roundedPointsA;
              }
              const lastPlaceA = parseInt(a.places[a.places.length - 1], 10);
              const lastPlaceB = parseInt(b.places[b.places.length - 1], 10);
              return lastPlaceA - lastPlaceB;
            });

          const summarySection = document.createElement('section');
          summarySection.dataset.generatedSection = 'summary';
          const summaryHeading = document.createElement('h2');
          summaryHeading.textContent = 'Summary by Date and Player';
          const summaryList = document.createElement('div');
          summaryList.className = 'summary-night-list';
          summarySection.append(summaryHeading, summaryList);

          const groupedEntries = [];
          summaryEntries.forEach(entry => {
            const lastGroup = groupedEntries[groupedEntries.length - 1];
            const groupKey = `${entry.season}|${entry.date}`;
            if (!lastGroup || lastGroup.key !== groupKey) {
              groupedEntries.push({
                key: groupKey,
                date: entry.date,
                season: entry.season,
                isMajor: entry.isMajor,
                majorName: entry.majorName,
                entries: []
              });
            }
            groupedEntries[groupedEntries.length - 1].entries.push(entry);
          });

          groupedEntries.forEach(group => {
            const nightSection = document.createElement('div');
            nightSection.className = 'summary-night';

            const nightHeading = document.createElement('h3');
            nightHeading.className = 'summary-night-heading';
            nightHeading.textContent = getSummaryNightHeading(group, document.getElementById('season-filter').value);

            const tableContainer = document.createElement('div');
            tableContainer.className = 'table-container';
            const table = document.createElement('table');
            table.className = 'summary-table';
            table.innerHTML = `
              <thead>
                <tr>
                  <th class="summary-date-column">Date</th>
                  <th>Player</th>
                  <th>Points</th>
                  <th>Places</th>
                  <th>Final</th>
                  <th class="summary-bracelet-column">Bracelet</th>
                  <th class="summary-major-column">Major Name</th>
                </tr>
              </thead>
              <tbody></tbody>
            `;

            const summaryBody = table.querySelector('tbody');
            group.entries.forEach((entry, index) => {
              const tr = document.createElement('tr');
              tr.dataset.isMajor = entry.isMajor;
              tr.dataset.season = entry.season;
              tr.appendChild(createSummaryCell('Date', formatSummaryDate(entry.date), 'summary-date-column'));

              const playerCell = createSummaryCell('Player', entry.player);
              if (index === 0) {
                playerCell.append(' ', createBraceletMarker(entry.season));
              }
              tr.appendChild(playerCell);

              tr.appendChild(createSummaryCell('Points', entry.points.toFixed(2)));
              tr.appendChild(createSummaryCell('Places', entry.places.join(', ')));
              tr.appendChild(createSummaryCell('Final', entry.places[entry.places.length - 1]));
              tr.appendChild(createSummaryCell('Bracelet', index === 0 ? '1' : '', 'summary-bracelet-column'));
              tr.appendChild(createSummaryCell('Major Name', entry.majorName || '', 'summary-major-column'));
              summaryBody.appendChild(tr);
            });

            tableContainer.appendChild(table);
            nightSection.append(nightHeading, tableContainer);
            summaryList.appendChild(nightSection);
          });

          document.querySelector('main').appendChild(summarySection);
          generateSeasonStandingsTable(document.getElementById('season-filter').value);
        }

        function generateSeasonStandingsTable(seasonFilterValue) {
          // Track points plus bracelet totals by event type.
          const playerTotals = {};
          const rows = document.querySelectorAll('.summary-table tbody tr');
          const showChampColumn = seasonFilterValue === "All Time";

          rows.forEach(row => {
            const player = row.cells[1]?.textContent.trim();
            const points = parseFloat(row.cells[2]?.textContent.trim());
            const bracelet = row.cells[5]?.textContent.trim() === '1' ? 1 : 0;
            const isMajor = row.dataset.isMajor?.trim().toUpperCase() === 'YES';

            if (!playerTotals[player]) {
              playerTotals[player] = { points: 0, bracelets: 0, majorBracelets: 0 };
            }
            playerTotals[player].points += points;
            playerTotals[player].bracelets += bracelet;
            if (bracelet && isMajor) {
              playerTotals[player].majorBracelets += 1;
            }
          });

          function getChampionCounts() {
            const seasonTotals = {};
            rows.forEach(row => {
              const season = row.dataset.season;
              const player = row.cells[1]?.textContent.trim();
              const points = parseFloat(row.cells[2]?.textContent.trim());
              if (!season || season === currentSeason || !player || !Number.isFinite(points)) return;

              if (!seasonTotals[season]) {
                seasonTotals[season] = {};
              }
              seasonTotals[season][player] = (seasonTotals[season][player] || 0) + points;
            });

            const championCounts = {};
            Object.values(seasonTotals).forEach(totals => {
              let champion = '';
              let championPoints = -Infinity;
              Object.entries(totals).forEach(([player, points]) => {
                if (points > championPoints) {
                  champion = player;
                  championPoints = points;
                }
              });
              if (champion) {
                championCounts[champion] = (championCounts[champion] || 0) + 1;
              }
            });

            return championCounts;
          }

          function getSelectedSeasonChampion() {
            if (seasonFilterValue === "All Time" || seasonFilterValue === currentSeason) {
              return '';
            }

            let champion = '';
            let championPoints = -Infinity;
            Object.entries(playerTotals).forEach(([player, totals]) => {
              if (totals.points > championPoints) {
                champion = player;
                championPoints = totals.points;
              }
            });

            return champion;
          }

          const championCounts = showChampColumn ? getChampionCounts() : {};
          const selectedSeasonChampion = getSelectedSeasonChampion();

          const standingsSection = document.createElement('section');
          standingsSection.dataset.generatedSection = 'season-standings';
          standingsSection.innerHTML = `
            <h2>Point and Bracelet Standings</h2>
            <div class="table-container">
              <table id="season-standings-table">
                <thead>
                  <tr>
                    <th>Player</th>
                    <th>Points</th>
                    ${showChampColumn ? '<th>👑</th>' : ''}
                    <th>⭕</th>
                    <th>🎉</th>
                  </tr>
                </thead>
                <tbody></tbody>
                <tfoot></tfoot>
              </table>
            </div>
            ${showChampColumn ? `
              <div class="all-time-major-summary">
                <h2>Major Summary</h2>
                <div class="table-container">
                  <table id="all-time-major-summary-table">
                    <thead>
                      <tr>
                        <th>Major Name</th>
                        <th>Number</th>
                        <th>Most Frequent Winner</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
              <details class="standings-chart-disclosure">
                <summary>Show all-time plots</summary>
                <div id="all-time-chart-list" class="standings-chart-list">
                  <div class="standings-chart-block">
                    <h2>Top 8 Cumulative Bracelets Over Time</h2>
                    <div class="standings-chart-frame">
                      <svg id="all-time-bracelet-chart" class="standings-chart" viewBox="0 0 900 540" role="img" aria-labelledby="all-time-bracelet-chart-title all-time-bracelet-chart-description">
                        <title id="all-time-bracelet-chart-title">Cumulative bracelets over time for the top eight all-time bracelet earners</title>
                        <desc id="all-time-bracelet-chart-description">A line chart will appear after the all-time standings load.</desc>
                      </svg>
                    </div>
                  </div>
                  <div class="standings-chart-block">
                    <h2>Top 8 Cumulative Major Wins Over Time</h2>
                    <div class="standings-chart-frame">
                      <svg id="all-time-major-chart" class="standings-chart" viewBox="0 0 900 540" role="img" aria-labelledby="all-time-major-chart-title all-time-major-chart-description">
                        <title id="all-time-major-chart-title">Cumulative major wins over time for the top eight all-time major winners</title>
                        <desc id="all-time-major-chart-description">A line chart will appear after the all-time standings load.</desc>
                      </svg>
                    </div>
                  </div>
                </div>
              </details>
            ` : ''}
          `;
          // Insert standingsSection after the filter section at the top of main
          const main = document.querySelector('main');
          const firstSection = main.querySelector('section');
          main.insertBefore(standingsSection, firstSection.nextSibling);

          const standingsBody = document.querySelector('#season-standings-table tbody');
          const standingsFooter = document.querySelector('#season-standings-table tfoot');
          Object.entries(playerTotals)
            .sort(([, a], [, b]) => {
              return seasonFilterValue === "All Time"
                ? b.bracelets - a.bracelets
                : b.points - a.points;
            })
            .forEach(([player, { points, bracelets, majorBracelets }]) => {
              const tr = document.createElement('tr');
              const displayPlayer = `${player}${seasonFilterValue === "All Time" && player === "Siri" ? ' 🐐' : ''}${player === selectedSeasonChampion ? ' 👑' : ''}`;
              tr.innerHTML = `
                <td>${displayPlayer}</td>
                <td>${points.toFixed(2)}</td>
                ${showChampColumn ? `<td>${championCounts[player] || 0}</td>` : ''}
                <td>${bracelets}</td>
                <td>${majorBracelets}</td>
              `;
              standingsBody.appendChild(tr);
            });

          const standingsTotals = Object.values(playerTotals).reduce((totals, player) => {
            totals.bracelets += player.bracelets;
            totals.majorBracelets += player.majorBracelets;
            return totals;
          }, {
            champions: Object.values(championCounts).reduce((total, count) => total + count, 0),
            bracelets: 0,
            majorBracelets: 0
          });

          const totalRow = document.createElement('tr');
          totalRow.innerHTML = `
            <td>Totals</td>
            <td></td>
            ${showChampColumn ? `<td>${standingsTotals.champions}</td>` : ''}
            <td>${standingsTotals.bracelets}</td>
            <td>${standingsTotals.majorBracelets}</td>
          `;
          standingsFooter.appendChild(totalRow);

          applyStripingByDate('season-standings-table');
          if (showChampColumn) {
            renderAllTimeMajorSummaryTable();
            renderAllTimeCharts();
          }
        }

        function createSvgElement(tagName, attributes = {}) {
          const element = document.createElementNS('http://www.w3.org/2000/svg', tagName);
          Object.entries(attributes).forEach(([name, value]) => {
            element.setAttribute(name, value);
          });
          return element;
        }

        function addSvgText(parent, text, attributes = {}) {
          const element = createSvgElement('text', attributes);
          element.textContent = text;
          parent.appendChild(element);
          return element;
        }

        const CHART_COLORS = [
          '#005bbb',
          '#d1495b',
          '#007f5f',
          '#8f2d56',
          '#f28e2b',
          '#4e79a7',
          '#59a14f',
          '#b07aa1',
          '#9c755f',
          '#e15759',
          '#76b7b2',
          '#edc948',
        ];

        function buildPlayerColorMap(...seriesGroups) {
          const playerColors = {};
          let colorIndex = 0;

          seriesGroups.flat().forEach(playerSeries => {
            if (playerColors[playerSeries.player]) return;
            playerColors[playerSeries.player] = CHART_COLORS[colorIndex % CHART_COLORS.length];
            colorIndex += 1;
          });

          return function getPlayerColor(player) {
            if (playerColors[player]) return playerColors[player];
            const hash = player.split('').reduce((total, character) => total + character.charCodeAt(0), 0);
            return CHART_COLORS[hash % CHART_COLORS.length];
          };
        }

        function calculateNightPoints(pointsAtStake, isMajor, playerCount, place) {
          const base = 0.5 * playerCount - 0.5;
          let points = pointsAtStake * (playerCount - place) / base;
          if (isMajor !== 'YES') {
            points /= 2;
          }
          return Number.isFinite(points) ? points : 0;
        }

        function compareNightResults(a, b) {
          const roundedPointsA = parseFloat(a.points.toFixed(2));
          const roundedPointsB = parseFloat(b.points.toFixed(2));
          if (roundedPointsA !== roundedPointsB) {
            return roundedPointsB - roundedPointsA;
          }

          return a.finalPlace - b.finalPlace;
        }

        function buildAllTimeNightRows() {
          return GoptData.buildNights(parsedData.rows).map(night => ({
            eventNumber: night.eventNumber,
            timestamp: night.timestamp,
            isMajor: night.isMajor,
            majorName: night.majorName,
            winner: night.winner,
          }));
        }

        function buildAllTimeMajorSummaryRows() {
          const majorMap = new Map();

          buildAllTimeNightRows()
            .filter(row => row.isMajor === 'YES' && row.majorName)
            .forEach(row => {
              if (!majorMap.has(row.majorName)) {
                majorMap.set(row.majorName, {
                  majorName: row.majorName,
                  number: 0,
                  winners: new Map(),
                });
              }

              const summary = majorMap.get(row.majorName);
              summary.number += 1;
              if (row.winner) {
                summary.winners.set(row.winner, (summary.winners.get(row.winner) || 0) + 1);
              }
            });

          return Array.from(majorMap.values())
            .map(summary => {
              const highCount = Math.max(0, ...summary.winners.values());
              const frequentWinners = Array.from(summary.winners.entries())
                .filter(([, count]) => count === highCount)
                .map(([winner]) => winner)
                .sort((a, b) => a.localeCompare(b));

              return {
                majorName: summary.majorName,
                number: summary.number,
                mostFrequentWinner: frequentWinners.length
                  ? `${frequentWinners.join(', ')} (${highCount})`
                  : '',
              };
            })
            .sort((a, b) => a.majorName.localeCompare(b.majorName));
        }

        function renderAllTimeMajorSummaryTable() {
          const body = document.querySelector('#all-time-major-summary-table tbody');
          if (!body) return;

          body.innerHTML = '';
          buildAllTimeMajorSummaryRows().forEach(row => {
            const tr = document.createElement('tr');
            ['majorName', 'number', 'mostFrequentWinner'].forEach(field => {
              const td = document.createElement('td');
              td.textContent = row[field];
              tr.appendChild(td);
            });
            body.appendChild(tr);
          });
        }

        function getTopWinners(rows, shouldCountRow, limit = 8) {
          const totals = rows.reduce((counts, row) => {
            if (!row.winner || !shouldCountRow(row)) return counts;
            counts[row.winner] = (counts[row.winner] || 0) + 1;
            return counts;
          }, {});

          return Object.entries(totals)
            .sort(([playerA, countA], [playerB, countB]) => {
              if (countA !== countB) return countB - countA;
              return playerA.localeCompare(playerB);
            })
            .slice(0, limit)
            .map(([player, total]) => ({ player, total }));
        }

        function buildCumulativeWinSeries(rows, shouldCountRow, limit = 8) {
          const leaders = getTopWinners(rows, shouldCountRow, limit);
          const leaderNames = leaders.map(leader => leader.player);
          const runningTotals = Object.fromEntries(leaderNames.map(player => [player, 0]));
          const series = Object.fromEntries(leaderNames.map(player => [player, []]));

          rows.forEach(row => {
            if (leaderNames.includes(row.winner) && shouldCountRow(row)) {
              runningTotals[row.winner] += 1;
            }

            leaderNames.forEach(player => {
              series[player].push({
                eventNumber: row.eventNumber,
                timestamp: row.timestamp,
                total: runningTotals[player],
              });
            });
          });

          return leaders.map(leader => ({
            ...leader,
            points: series[leader.player],
          }));
        }

        function renderCumulativeChart(options) {
          const {
            svgId,
            series,
            rows,
            chartTitle,
            emptyMessage,
            yAxisLabel,
            unitSingular,
            unitPlural,
            getPlayerColor,
          } = options;
          const svg = document.getElementById(svgId);
          if (!svg) return;
          svg.replaceChildren();

          const title = createSvgElement('title', { id: `${svgId}-title` });
          title.textContent = chartTitle;
          const description = createSvgElement('desc', { id: `${svgId}-description` });
          svg.append(title, description);

          if (!series.length) {
            description.textContent = emptyMessage;
            addSvgText(svg, emptyMessage, {
              x: 450,
              y: 215,
              'text-anchor': 'middle',
              class: 'chart-label',
            });
            return;
          }

          const width = 900;
          const height = 540;
          const margin = { top: 34, right: 42, bottom: 138, left: 56 };
          const plotWidth = width - margin.left - margin.right;
          const plotHeight = height - margin.top - margin.bottom;
          const minTime = Math.min(...rows.map(row => row.timestamp));
          const maxTime = Math.max(...rows.map(row => row.timestamp));
          const maxWins = Math.max(...series.map(playerSeries => playerSeries.total));
          const yMax = Math.max(5, Math.ceil(maxWins / 5) * 5);

          const xScale = timestamp => {
            if (minTime === maxTime) return margin.left + plotWidth / 2;
            return margin.left + ((timestamp - minTime) / (maxTime - minTime)) * plotWidth;
          };

          const yScale = total => margin.top + plotHeight - (total / yMax) * plotHeight;

          const gridGroup = createSvgElement('g');
          const yStep = Math.max(1, Math.ceil(yMax / 5));
          for (let value = 0; value <= yMax; value += yStep) {
            const y = yScale(value);
            gridGroup.appendChild(createSvgElement('line', {
              x1: margin.left,
              y1: y,
              x2: margin.left + plotWidth,
              y2: y,
              class: 'chart-grid',
            }));
            addSvgText(gridGroup, value, {
              x: margin.left - 10,
              y: y + 4,
              'text-anchor': 'end',
              class: 'chart-label',
            });
          }
          svg.appendChild(gridGroup);

          svg.appendChild(createSvgElement('line', {
            x1: margin.left,
            y1: margin.top + plotHeight,
            x2: margin.left + plotWidth,
            y2: margin.top + plotHeight,
            class: 'chart-axis',
          }));
          svg.appendChild(createSvgElement('line', {
            x1: margin.left,
            y1: margin.top,
            x2: margin.left,
            y2: margin.top + plotHeight,
            class: 'chart-axis',
          }));

          const startYear = new Date(minTime * 1000).getFullYear();
          const endYear = new Date(maxTime * 1000).getFullYear();
          const yearStep = Math.max(1, Math.ceil((endYear - startYear) / 5));
          for (let year = startYear; year <= endYear; year += yearStep) {
            const timestamp = new Date(year, 0, 1).getTime() / 1000;
            if (timestamp < minTime || timestamp > maxTime) continue;
            const x = xScale(timestamp);
            svg.appendChild(createSvgElement('line', {
              x1: x,
              y1: margin.top + plotHeight,
              x2: x,
              y2: margin.top + plotHeight + 6,
              class: 'chart-axis',
            }));
            addSvgText(svg, year, {
              x,
              y: margin.top + plotHeight + 24,
              'text-anchor': 'middle',
              class: 'chart-label',
            });
          }

          addSvgText(svg, yAxisLabel, {
            x: margin.left,
            y: 18,
            class: 'chart-title-label chart-label',
          });
          addSvgText(svg, 'Year', {
            x: margin.left + plotWidth,
            y: margin.top + plotHeight + 48,
            'text-anchor': 'end',
            class: 'chart-title-label chart-label',
          });

          const lineGroup = createSvgElement('g');
          series.forEach(playerSeries => {
            const color = getPlayerColor(playerSeries.player);
            const pathData = playerSeries.points.map((point, pointIndex) => {
              const command = pointIndex === 0 ? 'M' : 'L';
              return `${command}${xScale(point.timestamp).toFixed(2)},${yScale(point.total).toFixed(2)}`;
            }).join(' ');

            lineGroup.appendChild(createSvgElement('path', {
              d: pathData,
              stroke: color,
              class: 'chart-line',
            }));

            const finalPoint = playerSeries.points[playerSeries.points.length - 1];
            lineGroup.appendChild(createSvgElement('circle', {
              cx: xScale(finalPoint.timestamp),
              cy: yScale(finalPoint.total),
              r: 4,
              fill: color,
              class: 'chart-point',
            }));
          });
          svg.appendChild(lineGroup);

          const legend = createSvgElement('g', { transform: 'translate(56 468)' });
          series.forEach((playerSeries, index) => {
            const x = (index % 4) * 205;
            const y = Math.floor(index / 4) * 32;
            const color = getPlayerColor(playerSeries.player);
            legend.appendChild(createSvgElement('line', {
              x1: x,
              y1: y,
              x2: x + 26,
              y2: y,
              stroke: color,
              class: 'chart-line',
            }));
            addSvgText(legend, `${playerSeries.player} (${playerSeries.total})`, {
              x: x + 34,
              y: y + 5,
              class: 'chart-label',
            });
          });
          svg.appendChild(legend);

          description.textContent = series
            .map(playerSeries => {
              const unit = playerSeries.total === 1 ? unitSingular : unitPlural;
              return `${playerSeries.player} has ${playerSeries.total} ${unit}.`;
            })
            .join(' ');
        }

        function renderAllTimeCharts() {
          const rows = buildAllTimeNightRows();
          const braceletSeries = buildCumulativeWinSeries(rows, () => true);
          const majorSeries = buildCumulativeWinSeries(rows, row => row.isMajor === 'YES');
          const getPlayerColor = buildPlayerColorMap(braceletSeries, majorSeries);

          renderCumulativeChart({
            svgId: 'all-time-bracelet-chart',
            rows,
            series: braceletSeries,
            chartTitle: 'Cumulative bracelets over time for the top eight all-time bracelet earners',
            emptyMessage: 'No bracelet data available.',
            yAxisLabel: 'Bracelets',
            unitSingular: 'bracelet',
            unitPlural: 'bracelets',
            getPlayerColor,
          });

          renderCumulativeChart({
            svgId: 'all-time-major-chart',
            rows,
            series: majorSeries,
            chartTitle: 'Cumulative major wins over time for the top eight all-time major winners',
            emptyMessage: 'No major win data available.',
            yAxisLabel: 'Major Wins',
            unitSingular: 'major win',
            unitPlural: 'major wins',
            getPlayerColor,
          });
        }

        function applyStripingByDate(tableId) {
          const table = document.getElementById(tableId);
          const rows = Array.from(table.querySelectorAll('tbody tr'));
          let lastDate = null;
          let toggle = false;
          const stripeOne = '#e0e0e0';
          const stripeTwo = '#ffffff';

          rows.forEach(row => {
            const dateCell = row.cells[0];
            if (!dateCell) return;
            const currentDate = dateCell.textContent.trim();

            if (currentDate !== lastDate) {
              toggle = !toggle;
              lastDate = currentDate;
            }

            row.style.backgroundColor = toggle ? stripeOne : stripeTwo;
          });
        }

        function getTextColorForRgb(rgb) {
          const [r, g, b] = rgb.match(/\d+/g).map(Number);
          const brightness = (r * 299 + g * 587 + b * 114) / 1000;
          return brightness < 128 ? 'white' : 'black';
        }

        function applyColorToElement(element, rgb) {
          if (!rgb) {
            element.style.backgroundColor = '';
            element.style.color = '';
            return;
          }

          element.style.backgroundColor = rgb;
          element.style.color = getTextColorForRgb(rgb);
        }

        function applySeasonColorsToBraceletMarkers() {
          document.querySelectorAll('.bracelet-marker[data-season]').forEach(marker => {
            marker.style.color = seasonColors[marker.dataset.season] || '';
          });
        }

        function updateSeasonColors() {
          const selected = seasonFilter.value;
          applyColorToElement(seasonFilter, seasonColors[selected]);
          applyColorToElement(standingsTitle, seasonColors[selected]);
          applySeasonColorsToBraceletMarkers();

          updateSeasonToggleButton();
        }

        function updateSeasonToggleButton() {
          if (!currentSeason) return;

          if (seasonFilter.value === currentSeason) {
            currentSeasonLink.textContent = "All time standings";
            currentSeasonLink.href = "#all-time";
            currentSeasonLink.setAttribute('aria-label', 'Show all time standings');
          } else {
            currentSeasonLink.textContent = `Current season: ${currentSeason}`;
            currentSeasonLink.href = "#current-season";
            currentSeasonLink.setAttribute('aria-label', `Show ${currentSeason} standings`);
          }
        }

        function getStandingsTitle(season) {
          return season === "All Time" ? "All Time Standings" : `${season} Standings`;
        }

        function applySeasonSelection(selected) {
          seasonFilter.value = selected;
          document.querySelectorAll('#standings-table tbody tr').forEach(row => {
            const season = row.cells[1].textContent.trim();
            row.style.display = selected === "All Time" || season === selected ? "" : "none";
          });
          standingsTitle.textContent = getStandingsTitle(selected);
          document.title = `${getStandingsTitle(selected)} | GOPT`;
          document.getElementById('season-header').textContent = `Tournament Data for ${selected}`;
          updateStackedTable(selected);
          updateSeasonColors();
        }

        // Default to All Time.
        applySeasonSelection("All Time");

        // Add filtering logic for the main table based on season selection
        seasonFilter.addEventListener('change', () => {
          applySeasonSelection(seasonFilter.value);
        });

        currentSeasonLink.addEventListener('click', event => {
          event.preventDefault();
          if (currentSeason) {
            applySeasonSelection(seasonFilter.value === currentSeason ? "All Time" : currentSeason);
          }
        });

        fetch('files/seasoncolors.txt')
          .then(res => res.text())
          .then(colorData => {
            const colorLines = colorData.trim().split('\n');
            seasonColors = {};
            colorLines.forEach(line => {
              const [season, r, g, b] = line.split(',');
              seasonColors[season.trim()] = `rgb(${r},${g},${b})`;
            });

            updateSeasonColors();

            const rows = document.querySelectorAll('#standings-table tbody tr');
            rows.forEach(row => {
              const seasonCell = row.cells[1];
              if (!seasonCell) return;
              const season = seasonCell.textContent.trim();
              if (seasonColors[season]) {
                const rgb = seasonColors[season];
                seasonCell.style.backgroundColor = rgb;
                seasonCell.style.color = getTextColorForRgb(rgb);
              }
            });
          })
          .catch(err => {
            console.error('Error loading season colors:', err);
          });
      })
    .catch(error => {
      const table = document.getElementById('standings-table');
      table.innerHTML = "<caption>Failed to load standings.</caption>";
      console.error('Error loading data:', error);
    });
  </script>
  <script src="wachs-action.js"></script>
  
</body>
