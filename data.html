<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOPT Data</title>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=mobile-logo-20260505" />
  <style>
    body {
      font-family: 'Roboto Serif', serif;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Cal Sans', sans-serif;
    }

    main {
      box-sizing: border-box;
      margin: 0 auto 3rem;
      max-width: min(960px, calc(100vw - 2rem));
    }

    h1 {
      text-align: center;
    }

    .table-container {
      box-sizing: border-box;
      margin: 0 auto;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #night-data-table {
      margin: 1em auto;
      white-space: nowrap;
    }

    .data-message {
      text-align: center;
    }

    .chart-section {
      margin: 0 auto 2rem;
      max-width: 100%;
    }

    .chart-section h2 {
      text-align: center;
    }

    .chart-frame {
      box-sizing: border-box;
      margin: 0 auto;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .data-chart {
      display: block;
      height: auto;
      margin: 0 auto;
      max-width: 100%;
      min-width: 700px;
    }

    .chart-axis,
    .chart-grid {
      stroke: #d7d7d7;
      stroke-width: 1;
    }

    .chart-axis {
      stroke: #222;
    }

    .chart-line {
      fill: none;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .chart-point {
      stroke: #fff;
      stroke-width: 1.5;
    }

    .chart-label {
      fill: #222;
      font-family: 'Roboto Serif', serif;
      font-size: 13px;
    }

    .chart-title-label {
      font-family: 'Cal Sans', sans-serif;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .table-container {
        font-size: 0.82em;
      }
    }
  </style>
</head>
<body>
  <header style="text-align: center;">
    <img src="assets/logo.GIF" alt="GOPT Logo" class="logo" />
    <nav style="background-color: black; padding: 0.5em;">
      <a href="index.html" style="color: white; text-decoration: none; margin: 0 1em;">Standings</a>
      <a href="record.html" style="color: white; text-decoration: none; margin: 0 1em;">Record</a>
      <a href="rules.html" style="color: white; text-decoration: none; margin: 0 1em;">Rules</a>
      <a href="technote.html" style="color: white; text-decoration: none; margin: 0 1em;">Tech Note</a>
      <a href="upload.html" style="color: white; text-decoration: none; margin: 0 1em;">Admin</a>
    </nav>
    <h1>GOPT Data</h1>
  </header>

  <main>
    <p id="data-message" class="data-message">Loading current history...</p>
    <section class="chart-section" aria-labelledby="bracelet-chart-heading">
      <h2 id="bracelet-chart-heading">Top 8 Cumulative Bracelets Over Time</h2>
      <div class="chart-frame">
        <svg id="bracelet-chart" class="data-chart" viewBox="0 0 900 540" role="img" aria-labelledby="bracelet-chart-title bracelet-chart-description">
          <title id="bracelet-chart-title">Cumulative bracelets over time for the top eight all-time bracelet earners</title>
          <desc id="bracelet-chart-description">A line chart will appear after the current history file loads.</desc>
        </svg>
      </div>
    </section>
    <section class="chart-section" aria-labelledby="major-chart-heading">
      <h2 id="major-chart-heading">Top 8 Cumulative Major Wins Over Time</h2>
      <div class="chart-frame">
        <svg id="major-chart" class="data-chart" viewBox="0 0 900 540" role="img" aria-labelledby="major-chart-title major-chart-description">
          <title id="major-chart-title">Cumulative major wins over time for the top eight all-time major winners</title>
          <desc id="major-chart-description">A line chart will appear after the current history file loads.</desc>
        </svg>
      </div>
    </section>
    <div class="table-container">
      <table id="night-data-table">
        <thead>
          <tr>
            <th>Event #</th>
            <th>Date</th>
            <th>Season</th>
            <th>Is Major</th>
            <th>Major Name</th>
            <th>Winner</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script>
    function looksLikeHistoryFile(text) {
      return /^\d+\s*(\n|$)/.test(text.trim());
    }

    function fetchHistoryText(sources = ['api/history/current', 'api/history-current.php', 'files/GOPThistory.txt']) {
      const [source, ...remaining] = sources;
      return fetch(source, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) {
            throw new Error(`Could not load ${source}.`);
          }
          return response.text();
        })
        .then(text => {
          if (!looksLikeHistoryFile(text)) {
            throw new Error(`${source} did not return a GOPThistory file.`);
          }
          return text;
        })
        .catch(error => {
          if (!remaining.length) throw error;
          return fetchHistoryText(remaining);
        });
    }

    function splitHistoryLine(line) {
      return line.split(',').map(cell => {
        const value = cell.trim();
        return value === 'Mrs. Clay Matthews' ? 'Mrs. Clay' : value;
      });
    }

    function formatDate(timestamp) {
      return new Intl.DateTimeFormat('en-US', {
        year: 'numeric',
        month: 'numeric',
        day: 'numeric'
      }).format(new Date(timestamp * 1000));
    }

    function calculatePoints(pointsAtStake, isMajor, playerCount, place) {
      const base = 0.5 * playerCount - 0.5;
      let points = pointsAtStake * (playerCount - place) / base;
      if (isMajor !== 'YES') {
        points /= 2;
      }
      return Number.isFinite(points) ? points : 0;
    }

    function compareNightResults(a, b) {
      const roundedPointsA = parseFloat(a.points.toFixed(2));
      const roundedPointsB = parseFloat(b.points.toFixed(2));
      if (roundedPointsA !== roundedPointsB) {
        return roundedPointsB - roundedPointsA;
      }

      return a.finalPlace - b.finalPlace;
    }

    function buildNightRows(historyText) {
      const nights = new Map();
      historyText.trim().split('\n').slice(1).forEach(line => {
        const cells = splitHistoryLine(line);
        const season = cells[1];
        const timestamp = Number.parseInt(cells[2], 10);
        const isMajor = String(cells[3] || '').toUpperCase();
        const majorName = isMajor === 'YES' ? cells[4] || '' : '';
        const pointsAtStake = Number.parseFloat(cells[5]);
        const players = cells.slice(6).filter(Boolean);
        const playerCount = players.length;
        if (!season || !Number.isInteger(timestamp) || !playerCount) return;

        const key = `${season}|${timestamp}`;
        if (!nights.has(key)) {
          nights.set(key, {
            season,
            timestamp,
            isMajor,
            majorName,
            players: new Map(),
          });
        }

        const night = nights.get(key);
        if (isMajor === 'YES') {
          night.isMajor = 'YES';
          night.majorName = majorName;
        }

        players.forEach((player, index) => {
          const place = index + 1;
          if (!night.players.has(player)) {
            night.players.set(player, { player, points: 0, finalPlace: place });
          }

          const result = night.players.get(player);
          result.points += calculatePoints(pointsAtStake, isMajor, playerCount, place);
          result.finalPlace = place;
        });
      });

      return Array.from(nights.values())
        .sort((a, b) => a.timestamp - b.timestamp)
        .map((night, index) => {
          const winner = Array.from(night.players.values()).sort(compareNightResults)[0]?.player || '';
          return {
            eventNumber: index + 1,
            date: formatDate(night.timestamp),
            timestamp: night.timestamp,
            season: night.season,
            isMajor: night.isMajor,
            majorName: night.majorName,
            winner,
          };
        });
    }

    function renderNightRows(rows) {
      const body = document.querySelector('#night-data-table tbody');
      body.innerHTML = '';

      rows.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.eventNumber}</td>
          <td>${row.date}</td>
          <td>${row.season}</td>
          <td>${row.isMajor}</td>
          <td>${row.majorName}</td>
          <td>${row.winner}</td>
        `;
        body.appendChild(tr);
      });

      document.getElementById('data-message').textContent = `${rows.length} nights loaded.`;
    }

    function createSvgElement(tagName, attributes = {}) {
      const element = document.createElementNS('http://www.w3.org/2000/svg', tagName);
      Object.entries(attributes).forEach(([name, value]) => {
        element.setAttribute(name, value);
      });
      return element;
    }

    function addSvgText(parent, text, attributes = {}) {
      const element = createSvgElement('text', attributes);
      element.textContent = text;
      parent.appendChild(element);
      return element;
    }

    function getTopWinners(rows, shouldCountRow, limit = 8) {
      const totals = rows.reduce((counts, row) => {
        if (!row.winner || !shouldCountRow(row)) return counts;
        counts[row.winner] = (counts[row.winner] || 0) + 1;
        return counts;
      }, {});

      return Object.entries(totals)
        .sort(([playerA, countA], [playerB, countB]) => {
          if (countA !== countB) return countB - countA;
          return playerA.localeCompare(playerB);
        })
        .slice(0, limit)
        .map(([player, total]) => ({ player, total }));
    }

    function buildCumulativeWinSeries(rows, shouldCountRow, limit = 8) {
      const leaders = getTopWinners(rows, shouldCountRow, limit);
      const leaderNames = leaders.map(leader => leader.player);
      const runningTotals = Object.fromEntries(leaderNames.map(player => [player, 0]));
      const series = Object.fromEntries(leaderNames.map(player => [player, []]));

      rows.forEach(row => {
        if (leaderNames.includes(row.winner) && shouldCountRow(row)) {
          runningTotals[row.winner] += 1;
        }

        leaderNames.forEach(player => {
          series[player].push({
            eventNumber: row.eventNumber,
            timestamp: row.timestamp,
            total: runningTotals[player],
          });
        });
      });

      return leaders.map(leader => ({
        ...leader,
        points: series[leader.player],
      }));
    }

    function buildBraceletSeries(rows) {
      return buildCumulativeWinSeries(rows, () => true);
    }

    function buildMajorSeries(rows) {
      return buildCumulativeWinSeries(rows, row => row.isMajor === 'YES');
    }

    function renderCumulativeChart(options) {
      const {
        svgId,
        series,
        rows,
        chartTitle,
        emptyMessage,
        yAxisLabel,
        unitSingular,
        unitPlural,
      } = options;
      const svg = document.getElementById(svgId);
      svg.replaceChildren();

      const title = createSvgElement('title', { id: `${svgId}-title` });
      title.textContent = chartTitle;
      const description = createSvgElement('desc', { id: `${svgId}-description` });
      svg.append(title, description);

      if (!series.length) {
        description.textContent = emptyMessage;
        addSvgText(svg, emptyMessage, {
          x: 450,
          y: 215,
          'text-anchor': 'middle',
          class: 'chart-label',
        });
        return;
      }

      const palette = ['#005bbb', '#d1495b', '#007f5f', '#8f2d56', '#f28e2b', '#4e79a7', '#59a14f', '#b07aa1'];
      const width = 900;
      const height = 540;
      const margin = { top: 34, right: 42, bottom: 138, left: 56 };
      const plotWidth = width - margin.left - margin.right;
      const plotHeight = height - margin.top - margin.bottom;
      const minTime = Math.min(...rows.map(row => row.timestamp));
      const maxTime = Math.max(...rows.map(row => row.timestamp));
      const maxWins = Math.max(...series.map(playerSeries => playerSeries.total));
      const yMax = Math.max(5, Math.ceil(maxWins / 5) * 5);

      const xScale = timestamp => {
        if (minTime === maxTime) return margin.left + plotWidth / 2;
        return margin.left + ((timestamp - minTime) / (maxTime - minTime)) * plotWidth;
      };

      const yScale = total => margin.top + plotHeight - (total / yMax) * plotHeight;

      const gridGroup = createSvgElement('g');
      const yStep = Math.max(1, Math.ceil(yMax / 5));
      for (let value = 0; value <= yMax; value += yStep) {
        const y = yScale(value);
        gridGroup.appendChild(createSvgElement('line', {
          x1: margin.left,
          y1: y,
          x2: margin.left + plotWidth,
          y2: y,
          class: 'chart-grid',
        }));
        addSvgText(gridGroup, value, {
          x: margin.left - 10,
          y: y + 4,
          'text-anchor': 'end',
          class: 'chart-label',
        });
      }
      svg.appendChild(gridGroup);

      svg.appendChild(createSvgElement('line', {
        x1: margin.left,
        y1: margin.top + plotHeight,
        x2: margin.left + plotWidth,
        y2: margin.top + plotHeight,
        class: 'chart-axis',
      }));
      svg.appendChild(createSvgElement('line', {
        x1: margin.left,
        y1: margin.top,
        x2: margin.left,
        y2: margin.top + plotHeight,
        class: 'chart-axis',
      }));

      const startYear = new Date(minTime * 1000).getFullYear();
      const endYear = new Date(maxTime * 1000).getFullYear();
      const yearStep = Math.max(1, Math.ceil((endYear - startYear) / 5));
      for (let year = startYear; year <= endYear; year += yearStep) {
        const timestamp = new Date(year, 0, 1).getTime() / 1000;
        if (timestamp < minTime || timestamp > maxTime) continue;
        const x = xScale(timestamp);
        svg.appendChild(createSvgElement('line', {
          x1: x,
          y1: margin.top + plotHeight,
          x2: x,
          y2: margin.top + plotHeight + 6,
          class: 'chart-axis',
        }));
        addSvgText(svg, year, {
          x,
          y: margin.top + plotHeight + 24,
          'text-anchor': 'middle',
          class: 'chart-label',
        });
      }

      addSvgText(svg, yAxisLabel, {
        x: margin.left,
        y: 18,
        class: 'chart-title-label chart-label',
      });
      addSvgText(svg, 'Year', {
        x: margin.left + plotWidth,
        y: margin.top + plotHeight + 48,
        'text-anchor': 'end',
        class: 'chart-title-label chart-label',
      });

      const lineGroup = createSvgElement('g');
      series.forEach((playerSeries, index) => {
        const color = palette[index % palette.length];
        const pathData = playerSeries.points.map((point, pointIndex) => {
          const command = pointIndex === 0 ? 'M' : 'L';
          return `${command}${xScale(point.timestamp).toFixed(2)},${yScale(point.total).toFixed(2)}`;
        }).join(' ');

        lineGroup.appendChild(createSvgElement('path', {
          d: pathData,
          stroke: color,
          class: 'chart-line',
        }));

        const finalPoint = playerSeries.points[playerSeries.points.length - 1];
        lineGroup.appendChild(createSvgElement('circle', {
          cx: xScale(finalPoint.timestamp),
          cy: yScale(finalPoint.total),
          r: 4,
          fill: color,
          class: 'chart-point',
        }));
      });
      svg.appendChild(lineGroup);

      const legend = createSvgElement('g', { transform: 'translate(56 468)' });
      series.forEach((playerSeries, index) => {
        const x = (index % 4) * 205;
        const y = Math.floor(index / 4) * 32;
        const color = palette[index % palette.length];
        legend.appendChild(createSvgElement('line', {
          x1: x,
          y1: y,
          x2: x + 26,
          y2: y,
          stroke: color,
          class: 'chart-line',
        }));
        addSvgText(legend, `${playerSeries.player} (${playerSeries.total})`, {
          x: x + 34,
          y: y + 5,
          class: 'chart-label',
        });
      });
      svg.appendChild(legend);

      description.textContent = series
        .map(playerSeries => {
          const unit = playerSeries.total === 1 ? unitSingular : unitPlural;
          return `${playerSeries.player} has ${playerSeries.total} ${unit}.`;
        })
        .join(' ');
    }

    function renderBraceletChart(rows) {
      renderCumulativeChart({
        svgId: 'bracelet-chart',
        rows,
        series: buildBraceletSeries(rows),
        chartTitle: 'Cumulative bracelets over time for the top eight all-time bracelet earners',
        emptyMessage: 'No bracelet data available.',
        yAxisLabel: 'Bracelets',
        unitSingular: 'bracelet',
        unitPlural: 'bracelets',
      });
    }

    function renderMajorChart(rows) {
      renderCumulativeChart({
        svgId: 'major-chart',
        rows,
        series: buildMajorSeries(rows),
        chartTitle: 'Cumulative major wins over time for the top eight all-time major winners',
        emptyMessage: 'No major win data available.',
        yAxisLabel: 'Major Wins',
        unitSingular: 'major win',
        unitPlural: 'major wins',
      });
    }

    fetchHistoryText()
      .then(historyText => {
        const rows = buildNightRows(historyText);
        renderBraceletChart(rows);
        renderMajorChart(rows);
        renderNightRows(rows);
      })
      .catch(error => {
        document.getElementById('data-message').textContent = 'Failed to load current history.';
        console.error(error);
      });
  </script>
  <script src="wachs-action.js"></script>
</body>
</html>
